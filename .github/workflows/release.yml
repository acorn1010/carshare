# Builds and pushes the container image on every master push: :latest plus an
# immutable timestamp-sha tag. Deploys are then a terraform apply with
# -var image_tag=<release tag>, so rollback is re-applying the previous tag.
name: release

on:
  push:
    branches: [master]

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          IMAGE=ghcr.io/${{ github.repository }}
          IMAGE=${IMAGE,,}
          RELEASE_TAG="$(date -u +%Y.%m.%d_%H.%M.%S)-$(git rev-parse --short HEAD)"
          docker build --platform linux/amd64 -t "${IMAGE}:latest" -t "${IMAGE}:${RELEASE_TAG}" .
          docker push "${IMAGE}:latest"
          docker push "${IMAGE}:${RELEASE_TAG}"
          echo "released ${IMAGE}:${RELEASE_TAG}" >> "$GITHUB_STEP_SUMMARY"

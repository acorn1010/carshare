# Deploys the frontend Worker on master pushes that touch web/. Builds on
# pull requests without deploying, so a broken build dies in review.
name: web-deploy

on:
  push:
    branches: [master]
    paths: ['web/**']
  pull_request:
    paths: ['web/**']

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Deploy
        if: github.event_name == 'push'
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy
